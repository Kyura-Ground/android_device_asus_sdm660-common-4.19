============================================
NTP серверы
============================================
Приоритет: российские государственные и инфраструктурные,
затем — азиатские/нейтральные пулы как резерв.
ВНИИФТРИ — Всероссийский НИИ физико-технических
и радиотехнических измерений (хранитель гос. эталона времени РФ)
Ростелеком — крупнейший гос. провайдер
MSK-IX — Московская точка обмена трафиком
Статус на июль 2025:
- time.xtracloud.net — периодически недоступен из РФ
- xtracloud/izatcloud Qualcomm — нестабильный доступ
- google NTP — частично работает, но ненадёжен
- ВНИИФТРИ, MSK-IX, ru.pool.ntp.org — стабильны

NTP_SERVER=ntp1.vniiftri.ru
NTP_SERVER_2=ntp2.vniiftri.ru
NTP_SERVER_3=ntp3.vniiftri.ru
NTP_SERVER_4=ntp.msk-ix.ru
