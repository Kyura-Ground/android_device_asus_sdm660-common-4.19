============================================
XTRA Data (Predicted Orbits)
============================================
XTRA — данные предсказанных орбит для быстрого старта.
Ситуация на 2025 и прогноз 2026:
Qualcomm izatcloud.net / xtracloud.net — нестабильный доступ из РФ.
Периодические блокировки на уровне CDN (Akamai, Cloudflare).
Если серверы недоступны — GPS работает автономно, просто
холодный старт занимает 30-90 секунд вместо 5-10.

XTRA_TEST_ENABLED = 1
XTRA_THROTTLE_ENABLED = 0
XTRA_SYSTEM_TIME_INJECT = 1
Серверы XTRA (Qualcomm Izat) — оставляем все три,
клиент попробует каждый по очереди

XTRA_SERVER_1=https://xtrapath1.izatcloud.net/xtra3grc.bin
XTRA_SERVER_2=https://xtrapath2.izatcloud.net/xtra3grc.bin
XTRA_SERVER_3=https://xtrapath3.izatcloud.net/xtra3grc.bin
Альтернативные зеркала (если основные заблокированы):
Можно попробовать через VPN или прокси на уровне системы.
Некоторые кастомные прошивки поддерживают локальные XTRA-кэши.
