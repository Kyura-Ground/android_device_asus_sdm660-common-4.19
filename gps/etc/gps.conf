============================================
AGPS / SUPL server settings
============================================
Ситуация на середину 2025 и прогноз на 2026:
supl.google.com — формально не заблокирован Роскомнадзором,
но Google периодически ограничивает доступ к своим сервисам
из РФ; возможны задержки и таймауты. Работает нестабильно.
Альтернативные SUPL-серверы:
supl.nokia.com:7275 — Nokia/HERE, менее вероятно заблокирован
supl.qxwz.com:7275 — китайский (Qianxun SI), стабилен из РФ
Рекомендация: попробовать по порядку, оставить работающий.
Если ни один SUPL не работает — A-GPS будет недоступен,
но автономный GPS/ГЛОНАСС продолжит работать (холодный старт ~60 сек).
Вариант А: Google (может работать)

#SUPL_HOST=supl.google.com
#SUPL_PORT=7275
Вариант Б: Nokia/HERE (рекомендуется попробовать первым)

SUPL_HOST=supl.nokia.com
SUPL_PORT=7275
Вариант В: китайский SUPL (если А и Б не работают)

#SUPL_HOST=supl.qxwz.com
#SUPL_PORT=7275
MO SUPL (Mobile Originated)

#MO_SUPL_HOST=supl.nokia.com
#MO_SUPL_PORT=7275
C2K PDE — CDMA, в РФ не используется

#C2K_HOST=c2k.pde.com
#C2K_PORT=1234
============================================
LTE Positioning Profile
============================================
Snapdragon 636/660 не поддерживает 5G,
убраны флаги NR5G (0x4 и 0x8)
0x1: LPP User Plane
0x2: LPP Control Plane

LPP_PROFILE = 0x3
============================================
Datum Type
============================================
0: WGS-84 — совместим со всеми гражданскими приложениями
(Яндекс.Карты, 2ГИС, OsmAnd и т.д.)
1: PZ-90 — только для спец. оборудования

DATUM_TYPE = 0
============================================
NMEA Configuration
============================================

NMEA_PROVIDER=0
NMEA_TAG_BLOCK_GROUPING_ENABLED = 0
CUSTOM_NMEA_GGA_FIX_QUALITY_ENABLED = 0
NMEA_REPORT_RATE=NHZ
============================================
Target type
============================================

SGLTE_TARGET=0
============================================
A-GLONASS Positioning Protocol
============================================
Критически важно для РФ — ГЛОНАСС является
основной навигационной системой.
Включаем все протоколы:
0x1: RRC CPlane
0x2: RRLP UPlane
0x4: LPP UPlane

A_GLONASS_POS_PROTOCOL_SELECT = 0xf
============================================
LPPe Technology
============================================

LPPE_CP_TECHNOLOGY = 0
LPPE_UP_TECHNOLOGY = 0
